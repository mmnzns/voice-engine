name: CI

on:
  push:
    branches: [main, 'v0.2.0-step-*']
  pull_request:
  # Actions > CI > Run workflow: also builds the Vulkan GPU versions (windows-gpu, below).
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm is Windows ARM64 (aarch64-pc-windows-msvc): the helpers and the speech crate must build and run
        # there too, for Snapdragon PCs. The free ARM64 runner is available because this repository is public.
        os: [windows-latest, macos-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Windows ARM64 needs clang-cl and Ninja (both are on the runner image: LLVM in C:\Program Files\LLVM, Ninja in
      # C:\Tools\Ninja). MSVC's own `cl` does not build it: whisper.cpp's and llama.cpp's ggml-cpu stop at configure time
      # with "MSVC is not supported for ARM, use clang" (ggml/src/ggml-cpu/CMakeLists.txt). The Visual Studio environment is
      # loaded for the ARM64 target (INCLUDE, LIB, the Windows SDK) because Ninja, unlike the Visual Studio generator,
      # does not find them itself.
      - name: Visual Studio environment (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: clang-cl and Ninja (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction Stop).Source
          $ninja = (Get-Command ninja -ErrorAction Stop).Source
          Write-Host "clang-cl: $clang"; & $clang --version
          Write-Host "ninja: $ninja"; & $ninja --version
          # The cc and cmake crates take the compiler from CC/CXX and the generator from CMAKE_GENERATOR.
          "CC=$clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CXX=$clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # llama-cpp-sys-2 compiles its wrapper_common.cpp with the cc crate, which does not pass /EHsc to clang-cl:
          # "cannot use 'try' with exceptions disabled". CXXFLAGS is read by the cc and cmake crates.
          "CXXFLAGS=/EHsc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The native libraries must be built for a fixed CPU baseline (.cargo/config.toml), not this runner's CPU. The debug
      # profile reuses the build above; the CMake configuration is the same in release.
      - name: Check the native baseline (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-baseline.sh debug
      - name: Check the native baseline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Asks cargo where each CMake cache is (the out_dir of the build script that ran), then reads it.
          # x64: GGML_NATIVE off and the AVX2 baseline. ARM64 (windows-11-arm): GGML_NATIVE off only, because GGML_AVX2 is
          # an x86 option and is not in the cache there. The ARM64 baseline is ggml's own: with GGML_NATIVE off and no
          # GGML_CPU_ARM_ARCH, ggml-cpu adds no -march/-mcpu at all, so clang uses its default for aarch64-pc-windows-msvc
          # (armv8-a with NEON; no dot-product or i8mm kernels), whatever the build machine's CPU is. llama-cpp-sys-2
          # sets GGML_CPU_ARM_ARCH only for aarch64 Linux and Android, and whisper.cpp only when told; nothing to set.
          $x64 = $env:RUNNER_ARCH -eq 'X64'
          $failed = $false
          foreach ($pair in @(@('llama-cpp-sys-2', 'voice-engine-llm'), @('whisper-rs-sys', 'voice-engine-stt'))) {
            $crate, $helper = $pair
            $json = cargo build -p $helper --message-format=json
            if ($LASTEXITCODE -ne 0) { throw "cargo build -p $helper failed" }
            $out = $json | ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
              Where-Object { $_.reason -eq 'build-script-executed' -and $_.package_id -like "*#$crate@*" } |
              Select-Object -Last 1 -ExpandProperty out_dir
            $cache = if ($out) { Join-Path $out 'build\CMakeCache.txt' } else { '' }
            if (-not $cache -or -not (Test-Path $cache)) {
              Write-Host "FAIL  ${helper}: no CMake cache for $crate (build script out_dir: '$out')"
              Write-Host "Every CMakeCache.txt under target:"
              Get-ChildItem -Path target -Recurse -Filter CMakeCache.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
              $failed = $true
              continue
            }
            $lines = Get-Content $cache
            $checks = @(@{ Name = 'GGML_NATIVE'; Pattern = '^GGML_NATIVE:BOOL=OFF$' })
            if ($x64) { $checks += @{ Name = 'GGML_AVX2'; Pattern = '^GGML_AVX2:[A-Z]+=ON$' } }
            foreach ($check in $checks) {
              $found = @($lines | Where-Object { $_ -match $check.Pattern })
              if ($found.Count -gt 0) {
                Write-Host "PASS  ${helper}: $crate has $($found[0]) ($cache)"
              } else {
                $has = @($lines | Where-Object { $_ -match "^$($check.Name):" }) -join ' '
                Write-Host "FAIL  ${helper}: $crate needs $($check.Pattern), its cache has: $has ($cache)"
                $failed = $true
              }
            }
            if (-not $x64) {
              # ARM64: show which -march/-mcpu flags ggml-cpu compiled with (none is the expected answer: clang's own
              # armv8-a default) and fail if one of them is "native", which would be the build machine's CPU.
              $ninjaFile = Join-Path $out 'build\build.ninja'
              $arch = @(Select-String -Path $ninjaFile -Pattern '-m(arch|cpu)=\S+' -AllMatches -ErrorAction SilentlyContinue |
                ForEach-Object { $_.Matches.Value } | Sort-Object -Unique)
              Write-Host "INFO  ${helper}: $crate compiled with -march/-mcpu flags: $(if ($arch) { $arch -join ' ' } else { '(none: the compiler default, armv8-a)' })"
              if ($arch -match 'native') { Write-Host "FAIL  ${helper}: $crate compiled for the build machine's CPU"; $failed = $true }
            }
          }
          if ($failed) { exit 1 }

  # The Vulkan builds of the llm and stt crates, with the Vulkan SDK. Manual only: the shaders take a while.
  windows-gpu:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gpu
          cache-directories: C:\tg
      - uses: ./.github/actions/vulkan-sdk
      - name: Vulkan builds and their tests
        shell: pwsh
        run: |
          # Ninja, not the Visual Studio generator, for the Vulkan builds (as llama.cpp's own Windows Vulkan CI does):
          # the vulkan-shaders-gen install step fails under MSBuild.
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $ninja = if (Test-Path $vswhere) { & $vswhere -latest -products * -find 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe' | Select-Object -First 1 }
            if (-not $ninja) { throw "ninja.exe not found" }
            $env:PATH = "$(Split-Path $ninja);$env:PATH"
          }
          $env:CMAKE_GENERATOR = 'Ninja'
          cargo test --release -p voice-engine-llm -p voice-engine-stt -p voice-engine-protocol --features voice-engine-llm/vulkan,voice-engine-stt/vulkan --target-dir C:\tg
