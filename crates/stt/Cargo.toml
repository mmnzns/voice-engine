[package]
name = "voice-engine-stt"
description = "Speech to text: Whisper in process (Metal on the Mac) and in the Windows GPU helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "voice_engine_stt"
path = "src/lib.rs"

# Only for this crate's own tests. Apps build their own helper binary with their own name.
[[bin]]
name = "voice-engine-stt"
path = "src/main.rs"

[dependencies]
voice-engine-protocol.workspace = true
# ModelInfo and Kind only. This crate never depends on voice-engine-llm (no llama.cpp: tests/no_llama.rs, Task 6).
voice-engine-models.workspace = true
serde_json.workspace = true
# raw-api: ggml's device list (whisper_rs::whisper_rs_sys), to choose the GPU.
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
# Parakeet, Parakeet Unified and Nemotron (ONNX). The same pins as Talaan and Ensayo: parakeet-rs 0.3.8 does not
# build against ort 2.0.0-rc.14 (Session::builder changed); keep rc.13 until it does. parakeet-rs's default features
# switch ort's own defaults back on (download-binaries: a static ONNX Runtime fetched once into the ort cache at
# build time, no DLL to ship), whatever `default-features = false` says here; that is what both apps build today.
# `sortformer` is speaker separation (`diarize.rs`, Talaan's feature set).
parakeet-rs = { version = "0.3.8", features = ["sortformer"] }
ort = { version = "=2.0.0-rc.13", default-features = false }

# Metal on the Mac, in process. Cargo unifies the features with the entry above.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

# Windows only, with the `directml` feature: lists the graphics adapters (DXGI, and DXCore for "integrated") so DirectML runs on the
# discrete card, not adapter 0 (directml.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_DXCore",
] }

[dev-dependencies]
tempfile.workspace = true
# The real-model tests find the default model folder (~/Library/Application Support/Talaan/models).
dirs.workspace = true

[features]
# Windows GPU build: needs the Vulkan SDK (VULKAN_SDK) to build and vulkan-1.dll to run. Never linked into an app's
# main program.
vulkan = ["whisper-rs/vulkan"]
# Windows only: Parakeet on the graphics card through ONNX Runtime's DirectML provider (`gpu: true`), on the discrete
# card only (never the iGPU), with the processor as the fallback. Without it, or on the Mac, `gpu: true` runs on the
# processor and says so. In the helper it also adds the DirectML adapters to the `devices` answer.
directml = ["ort/directml", "dep:windows"]
